# The active backend is defined in upstream.inc.
# deploy.sh rewrites that file and reloads nginx to switch traffic.
upstream backend {
    include /etc/nginx/conf.d/upstream.inc;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://backend;
    }
}
