server {
    listen 80;

    # Static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy: forward /api/* to the Spring container.
    # "app" is the compose service name, resolved by Docker's internal DNS.
    location /api/ {
        proxy_pass http://app:8080;
    }
}
