# Group of backend servers. Requests are distributed round-robin by default.
upstream backend {
    # Share round-robin state across nginx worker processes,
    # so requests alternate strictly even on multi-core machines.
    zone backend 64k;
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy to the upstream group instead of a single container.
    location /api/ {
        proxy_pass http://backend;
    }
}
