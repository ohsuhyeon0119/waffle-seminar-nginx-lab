name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # allows pushing the image to GHCR

jobs:
  deploy:
    # arm64 runner: same architecture as the OCI Ampere VM.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Version = "v" + the workflow run number, which GitHub increments on every run.
      # GHCR image names must be lowercase.
      - name: Set version and image name
        run: |
          echo "VERSION=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build --build-arg APP_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" app
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      # Run the blue-green switch on the VM.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: ~/seminar/labs/04-blue-green/deploy.sh ${{ env.IMAGE }}:${{ env.VERSION }}
